apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: social-benefit-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/akhilsplendid/devops-infra-helm-argo.git
    targetRevision: main
    path: helm/umbrella
  destination:
    server: https://kubernetes.default.svc
    namespace: social
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
