apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cases
  labels:
    grafana_dashboard: "1"
data:
  caseservice-overview.json: |
    {
      "schemaVersion": 37,
      "title": "Caseservice Overview",
      "panels": [
        {
          "type": "graph",
          "title": "HTTP Requests (rate)",
          "datasource": "Prometheus",
          "targets": [
            { "expr": "rate(http_server_requests_seconds_count{application=\"caseservice\"}[1m])" }
          ]
        }
      ]
    }
