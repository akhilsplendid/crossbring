trigger:
  branches:
    include:
      - main
      - refs/tags/v*

variables:
  ACR: $(ACR)
  dockerRegistryServiceConnection: $(dockerRegistryServiceConnection)
  k8sServiceConnectionDev: $(k8sServiceConnectionDev)
  k8sServiceConnectionProd: $(k8sServiceConnectionProd)
  namespaceDev: $(namespaceDev)
  namespaceProd: $(namespaceProd)

stages:
  - stage: Build
    displayName: Build and push images
    jobs:
      - job: build_caseservice
        displayName: Caseservice
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: Run tests (Gradle container)
            inputs:
              targetType: inline
              script: |
                docker run --rm -v $(System.DefaultWorkingDirectory)/java-spring-caseservice:/app -w /app gradle:8.10.2-jdk21-alpine sh -lc "gradle test --no-daemon"
          - task: Docker@2
            displayName: Build and push (caseservice)
            inputs:
              command: buildAndPush
              repository: caseservice
              dockerfile: java-spring-caseservice/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.SourceVersion)
                latest
                $(Build.SourceBranchName)

      - job: build_paymentservice
        displayName: Paymentservice
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: Run tests (with Testcontainers)
            inputs:
              targetType: inline
              script: |
                docker run --rm \
                  -v $(System.DefaultWorkingDirectory)/java-spring-paymentservice-messaging:/app -w /app \
                  -v /var/run/docker.sock:/var/run/docker.sock \
                  -e DOCKER_HOST=unix:///var/run/docker.sock \
                  gradle:8.10.2-jdk21-alpine sh -lc "gradle test --no-daemon"
          - task: Docker@2
            displayName: Build and push (paymentservice)
            inputs:
              command: buildAndPush
              repository: paymentservice
              dockerfile: java-spring-paymentservice-messaging/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.SourceVersion)
                latest
                $(Build.SourceBranchName)

      - job: build_eligibility
        displayName: Eligibility
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: Run tests (Gradle container)
            inputs:
              targetType: inline
              script: |
                docker run --rm -v $(System.DefaultWorkingDirectory)/java-spring-eligibility-hazelcast:/app -w /app gradle:8.10.2-jdk21-alpine sh -lc "gradle test --no-daemon"
          - task: Docker@2
            displayName: Build and push (eligibility)
            inputs:
              command: buildAndPush
              repository: eligibility
              dockerfile: java-spring-eligibility-hazelcast/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.SourceVersion)
                latest
                $(Build.SourceBranchName)

      - job: build_portal
        displayName: Citizen portal
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: Build and push (citizen-portal)
            inputs:
              command: buildAndPush
              repository: citizen-portal
              dockerfile: vue-citizen-portal/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.SourceVersion)
                latest
                $(Build.SourceBranchName)

  - stage: Deploy_Dev
    displayName: Deploy umbrella to Dev
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: '3.14.4'
                - bash: |
                    if [[ "$(Build.SourceBranch)" == refs/tags/* ]]; then
                      TAG="$(Build.SourceBranchName)"
                    else
                      TAG="$(Build.SourceVersion)"
                    fi
                    echo "##vso[task.setvariable variable=IMAGE_TAG]$TAG"
                  displayName: Derive image tag
                - task: HelmDeploy@0
                  displayName: Helm upgrade/install umbrella (dev)
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: $(k8sServiceConnectionDev)
                    namespace: $(namespaceDev)
                    command: 'upgrade'
                    chartType: FilePath
                    chartPath: devops-infra-helm-argo/helm/umbrella
                    releaseName: social-benefit-platform
                    install: true
                    arguments: |
                      --set caseservice.image.repository=$(ACR)/caseservice \
                      --set caseservice.image.tag=$(IMAGE_TAG) \
                      --set paymentservice.image.repository=$(ACR)/paymentservice \
                      --set paymentservice.image.tag=$(IMAGE_TAG) \
                      --set eligibility.image.repository=$(ACR)/eligibility \
                      --set eligibility.image.tag=$(IMAGE_TAG) \
                      --set citizen-portal.image.repository=$(ACR)/citizen-portal \
                      --set citizen-portal.image.tag=$(IMAGE_TAG)

  - stage: Deploy_Prod
    displayName: Deploy umbrella to Prod
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - deployment: Deploy
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: '3.14.4'
                - bash: |
                    if [[ "$(Build.SourceBranch)" == refs/tags/* ]]; then
                      TAG="$(Build.SourceBranchName)"
                    else
                      TAG="$(Build.SourceVersion)"
                    fi
                    echo "##vso[task.setvariable variable=IMAGE_TAG]$TAG"
                  displayName: Derive image tag
                - task: HelmDeploy@0
                  displayName: Helm upgrade/install umbrella (prod)
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: $(k8sServiceConnectionProd)
                    namespace: $(namespaceProd)
                    command: 'upgrade'
                    chartType: FilePath
                    chartPath: devops-infra-helm-argo/helm/umbrella
                    releaseName: social-benefit-platform
                    install: true
                    arguments: |
                      --set caseservice.image.repository=$(ACR)/caseservice \
                      --set caseservice.image.tag=$(IMAGE_TAG) \
                      --set paymentservice.image.repository=$(ACR)/paymentservice \
                      --set paymentservice.image.tag=$(IMAGE_TAG) \
                      --set eligibility.image.repository=$(ACR)/eligibility \
                      --set eligibility.image.tag=$(IMAGE_TAG) \
                      --set citizen-portal.image.repository=$(ACR)/citizen-portal \
                      --set citizen-portal.image.tag=$(IMAGE_TAG)
