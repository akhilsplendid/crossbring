parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - prod
  - name: imageTag
    displayName: Image tag to deploy (optional)
    type: string
    default: ''
  - name: monitoringEnabled
    displayName: Enable Prometheus ServiceMonitor
    type: boolean
    default: false

trigger:
  branches:
    include:
      - main
      - refs/tags/v*

variables:
  containerRegistry: $(ACR)

stages:
  - stage: Deploy
    displayName: Deploy umbrella chart
    jobs:
      - deployment: DeployUmbrella
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: '3.14.4'
                - bash: |
                    echo "Compute image tag"
                    if [ -n "${{ parameters.imageTag }}" ]; then
                      TAG='${{ parameters.imageTag }}'
                    else
                      # If running on a tag like refs/tags/v1.2.3 use the tag name, else use commit SHA
                      if [[ "$(Build.SourceBranch)" == refs/tags/* ]]; then
                        TAG="$(Build.SourceBranchName)"
                      else
                        TAG="$(Build.SourceVersion)"
                      fi
                    fi
                    echo "##vso[task.setvariable variable=IMAGE_TAG]$TAG"
                  displayName: Derive image tag
                - task: HelmDeploy@0
                  displayName: Helm upgrade/install umbrella
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: $[lower('${{ parameters.environment }}') == 'prod' ? variables.k8sServiceConnectionProd : variables.k8sServiceConnectionDev]
                    namespace: $[lower('${{ parameters.environment }}') == 'prod' ? variables.namespaceProd : variables.namespaceDev]
                    command: 'upgrade'
                    chartType: FilePath
                    chartPath: devops-infra-helm-argo/helm/umbrella
                    releaseName: social-benefit-platform
                    install: true
                    arguments: |
                      --set caseservice.image.repository=$(containerRegistry)/caseservice \
                      --set caseservice.image.tag=$(IMAGE_TAG) \
                      --set paymentservice.image.repository=$(containerRegistry)/paymentservice \
                      --set paymentservice.image.tag=$(IMAGE_TAG) \
                      --set eligibility.image.repository=$(containerRegistry)/eligibility \
                      --set eligibility.image.tag=$(IMAGE_TAG) \
                      --set citizen-portal.image.repository=$(containerRegistry)/citizen-portal \
                      --set citizen-portal.image.tag=$(IMAGE_TAG) \
                      --set global.monitoring.enabled=${{ parameters.monitoringEnabled }}
