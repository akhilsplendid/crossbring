trigger:
  paths:
    include:
      - java-spring-caseservice/*

variables:
  imageName: caseservice
  containerRegistry: $(ACR)

stages:
  - stage: Build
    jobs:
      - job: Test_Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: Run tests (Gradle container)
            inputs:
              targetType: inline
              script: |
                docker run --rm -v $(System.DefaultWorkingDirectory)/java-spring-caseservice:/app -w /app gradle:8.10.2-jdk21-alpine sh -lc "gradle test --no-daemon"
          - task: Docker@2
            displayName: Build and push
            inputs:
              command: buildAndPush
              repository: $(imageName)
              dockerfile: java-spring-caseservice/Dockerfile
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(Build.SourceVersion)
                latest
  - stage: Deploy_Dev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: '3.14.4'
                - task: HelmDeploy@0
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: $(k8sServiceConnectionDev)
                    namespace: $(namespaceDev)
                    command: 'upgrade'
                    chartType: FilePath
                    chartPath: java-spring-caseservice/helm/caseservice
                    releaseName: caseservice
                    install: true
                    arguments: |
                      --set image.repository=$(containerRegistry)/$(imageName) \
                      --set image.tag=$(Build.SourceVersion)
  - stage: Deploy_Prod
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - deployment: Deploy
        environment: prod
        strategy:
          runOnce:
            deploy:
              steps:
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: '3.14.4'
                - task: HelmDeploy@0
                  inputs:
                    connectionType: 'Kubernetes Service Connection'
                    kubernetesServiceConnection: $(k8sServiceConnectionProd)
                    namespace: $(namespaceProd)
                    command: 'upgrade'
                    chartType: FilePath
                    chartPath: java-spring-caseservice/helm/caseservice
                    releaseName: caseservice
                    install: true
                    arguments: |
                      --set image.repository=$(containerRegistry)/$(imageName) \
                      --set image.tag=$(Build.SourceVersion)
