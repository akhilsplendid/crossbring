apiVersion: apps/v1
kind: Deployment
metadata:
  name: caseservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caseservice
  template:
    metadata:
      labels:
        app: caseservice
    spec:
      containers:
        - name: caseservice
          image: your-registry/caseservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=80"
---
apiVersion: v1
kind: Service
metadata:
  name: caseservice
spec:
  selector:
    app: caseservice
  ports:
    - port: 80
      targetPort: 8081
