name: deploy-umbrella

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Target environment
        options:
          - dev
          - prod
        default: dev
      image_tag:
        type: string
        description: Image tag to deploy (defaults to SHA on branch or tag on release)
        required: false
      monitoring_enabled:
        type: boolean
        description: Enable Prometheus ServiceMonitor in all services
        default: false
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev') }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Derive image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi
      - name: Setup kubectl from env secrets
        run: |
          echo "${KUBE_CONFIG_BASE64}" | base64 -d > $HOME/.kubeconfig
          echo "KUBECONFIG=$HOME/.kubeconfig" >> $GITHUB_ENV
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG_BASE64 }}
      - name: Deploy umbrella chart
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.tag }}
          REG=ghcr.io/${{ github.repository_owner }}
          helm upgrade --install social-benefit-platform ./devops-infra-helm-argo/helm/umbrella \
            -n ${{ secrets.NAMESPACE }} --create-namespace \
            --set caseservice.image.repository=$REG/caseservice \
            --set caseservice.image.tag=$IMAGE_TAG \
            --set paymentservice.image.repository=$REG/paymentservice \
            --set paymentservice.image.tag=$IMAGE_TAG \
            --set eligibility.image.repository=$REG/eligibility \
            --set eligibility.image.tag=$IMAGE_TAG \
            --set citizen-portal.image.repository=$REG/citizen-portal \
            --set citizen-portal.image.tag=$IMAGE_TAG \
            --set global.monitoring.enabled=${{ inputs.monitoring_enabled || false }}
